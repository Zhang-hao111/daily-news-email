# 云端部署（替代本机 schtasks 定时任务，二选一避免重复邮件）。
# Secrets 需要：DEEPSEEK_API_KEY、SMTP_HOST/PORT/USER/AUTH_CODE、EMAIL_TO，
# 可选：FOCUS_KEYWORDS、EXCLUDE_KEYWORDS、PUSH_WEBHOOK_URL/PUSH_WEBHOOK_TYPE、NEWS_MAX_AGE_HOURS。
# 无 OBSIDIAN_VAULT_PATH 时脚本自动跳过 Obsidian 存档。
# 注意：GitHub 会在仓库 60 天无提交后停用定时工作流，偶尔推个提交即可保活。
name: Daily News Email

on:
  schedule:
    - cron: '23 23 * * *' # UTC 23:23 = 北京时间 07:23；避开整点/半点的调度高峰，减少延迟
  workflow_dispatch:

concurrency:
  group: daily-news
  cancel-in-progress: false # 手动触发与定时撞车时排队而非取消，不丢运行

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # state/ 保存防重复推送记录和周报积累数据，跨运行持久化
      - name: Restore state cache (dedupe + weekly accumulation)
        uses: actions/cache@v4
        with:
          path: state
          key: news-state-${{ github.run_id }}
          restore-keys: |
            news-state-
      - run: python send_email.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FOCUS_KEYWORDS: ${{ secrets.FOCUS_KEYWORDS }}
          EXCLUDE_KEYWORDS: ${{ secrets.EXCLUDE_KEYWORDS }}
          PUSH_WEBHOOK_URL: ${{ secrets.PUSH_WEBHOOK_URL }}
          PUSH_WEBHOOK_TYPE: ${{ secrets.PUSH_WEBHOOK_TYPE }}
          NEWS_MAX_AGE_HOURS: ${{ secrets.NEWS_MAX_AGE_HOURS }}
